name: OTH CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Lint & Type Check ──────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Root Dependencies
        run: npm install --no-audit
      - name: Run Linter
        run: npm run lint
        continue-on-error: true
      - name: Type check crypto
        run: cd crypto && npm install && npx tsc --noEmit --skipLibCheck
        continue-on-error: true
      - name: Type check backend
        run: cd backend && npm install && npx tsc --noEmit --skipLibCheck
        continue-on-error: true

  # ─── Unit Tests ─────────────────────────────────────────────────
  test-crypto:
    name: Crypto Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install & Run Crypto Tests
        run: cd crypto && npm install && npm test -- --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-coverage
          path: crypto/coverage/
        continue-on-error: true

  # ─── API Tests ──────────────────────────────────────────────────
  test-backend:
    name: Backend API Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: test_jwt_secret_minimum_32_characters_long
      OTH_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install & Run Backend Tests
        run: cd backend && npm install && npm test -- --forceExit
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
        continue-on-error: true

  # ─── Security Scan ──────────────────────────────────────────────
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --audit-level=high || true
        continue-on-error: true
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ─── Build Docker Images ─────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test-crypto, test-backend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
